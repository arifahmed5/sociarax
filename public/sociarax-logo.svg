<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 96" width="440" height="96">
  <defs>
    <linearGradient id="sociaraxGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Brand Icon Container -->
  <rect x="8" y="12" width="72" height="72" rx="20" fill="url(#sociaraxGrad)" filter="url(#glow)" />
  
  <!-- Lucide Zap Icon from SociaraX Website -->
  <g transform="translate(25, 25) scale(1.9)">
    <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- SociaraX Brand Typography -->
  <text x="98" y="58" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="-1px" 
        fill="#ffffff">SociaraX</text>

  <!-- SMM Badge -->
  <rect x="312" y="32" width="46" height="22" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1.2" />
  <text x="335" y="47.5" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="11" 
        font-weight="700" 
        letter-spacing="0.5px" 
        fill="#c7d2fe" 
        text-anchor="middle">SMM</text>

  <!-- Subtitle -->
  <text x="100" y="78" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="13" 
        font-weight="500" 
        letter-spacing="0.2px" 
        fill="#94a3b8">Enterprise Growth Portal</text>
</svg>
